name: CI
# Every push and pull request: unit tests, typecheck, production build, then the
# container image is built and started for real and checked by scripts/smoke-test.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  TURBO_TELEMETRY_DISABLED: '1'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Turborepo's local cache (no remote cache): test/typecheck/build of a workspace whose inputs
      # did not change are replayed from the previous run instead of run again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: npm test
        env:
          # The slow converter parity tests run in converter.yml, only when the converter changes.
          SKIP_CLO_PARITY: '1'
      - run: npm run typecheck
      - run: npm run build
      - name: The MCP package installs and starts
        run: scripts/mcp-pack-smoke.sh
  e2e:
    name: End-to-end (simulated pedal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
  container:
    name: Container lint, build, scan and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.15.1-debian hadolint - < Dockerfile
      - name: Validate compose.yaml
        run: docker compose config -q
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pocket-master-editor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for HIGH and CRITICAL vulnerabilities with a fix (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 pocket-master-editor:ci
      - name: Smoke test with the hardened runtime flags
        run: scripts/smoke-test.sh pocket-master-editor:ci
