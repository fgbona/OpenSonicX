name: Pages
# Publishes the web editor to GitHub Pages: on every release tag, or on demand (Actions > Pages >
# Run workflow). Without a custom domain the site lives under /<repository>; set the repository
# variable PAGES_DOMAIN (the domain also configured in Settings > Pages) to serve it from the root.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Static export
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_TONE3000_CLIENT_ID: ${{ vars.TONE3000_CLIENT_ID }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: |
          if [ -n "$PAGES_DOMAIN" ]; then export NEXT_BASE_PATH=""; else export NEXT_BASE_PATH="/${GITHUB_REPOSITORY#*/}"; fi
          npm run build -w @pocket-master/web
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/out
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
