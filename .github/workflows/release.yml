name: Release
# Push a tag like v0.2.0. The pipeline tests the code, publishes a multi-arch image
# (linux/amd64 and linux/arm64) to GHCR under the version tag, pulls that published
# image back and smoke-tests it, and only then moves `latest` and creates the GitHub
# release with that version's CHANGELOG.md section as notes. The desktop app is then
# built on Linux, Windows and macOS and its installers attached to that release; the
# installed apps update from there (latest*.yml).
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Test and check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # The slow converter parity tests run in converter.yml, only when the converter changes.
          SKIP_CLO_PARITY: '1'
      - run: npm run typecheck
      - run: npm run build
      - name: Tag matches every package.json version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in package.json packages/core/package.json apps/web/package.json apps/mcp/package.json apps/desktop/package.json; do
            test "$(node -p "require('./$f').version")" = "$v" || { echo "::error::$f version is not $v"; exit 1; }
          done
      - name: CHANGELOG.md has a section for this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG.md section for $v"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md

  publish:
    name: Publish image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: NEXT_PUBLIC_TONE3000_CLIENT_ID=${{ vars.TONE3000_CLIENT_ID }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Browser editor for the Sonicake Pocket Master over USB MIDI

  smoke:
    name: Smoke-test the published image
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Scan the published image (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - run: scripts/smoke-test.sh ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    name: Tag latest and create the GitHub release
    needs: smoke
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move latest to this version
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A full release, not a pre-release: the desktop apps update from releases/latest,
        # which skips pre-releases.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
          fi

  desktop:
    name: Desktop app (${{ matrix.os }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The MCP package is macOS/Linux only; the desktop app does not use it, so Windows skips that check.
      - run: npm ci ${{ runner.os == 'Windows' && '--force' || '' }}
      - run: npm run dist -w @pocket-master/desktop
        env:
          NEXT_PUBLIC_TONE3000_CLIENT_ID: ${{ vars.TONE3000_CLIENT_ID }}
      - name: Attach the installers and the updater metadata to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd apps/desktop/release
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" ./*.dmg ./*.zip ./*.exe ./*.AppImage ./*.blockmap ./latest*.yml --clobber

  npm:
    # Trusted publishing (OIDC): no npm token is stored. Off until the repository variable
    # NPM_PUBLISH is "true", which is set once the package exists on npm and this workflow is
    # registered as its trusted publisher.
    name: Publish the MCP server to npm
    needs: verify
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - run: scripts/mcp-pack-smoke.sh
      # prepack rebuilds with the editor's publishable TONE3000 key (an app id, not a secret).
      - run: npm publish -w sonicake-pocket-master-mcp --provenance --access public
        env:
          TONE3000_CLIENT_ID: ${{ vars.TONE3000_CLIENT_ID }}
