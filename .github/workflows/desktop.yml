name: Desktop
# Builds the desktop installers (no publishing) when the desktop app changes, or on demand,
# so packaging problems show before a release. The installers are kept as artifacts for a week.
on:
  pull_request:
    paths: ['apps/desktop/**', 'package-lock.json', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The MCP package is macOS/Linux only; the desktop app does not use it, so Windows skips that check.
      - run: npm ci ${{ runner.os == 'Windows' && '--force' || '' }}
      - run: npm run dist -w @pocket-master/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          retention-days: 7
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
